name: EcoTrack CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check Workspace TypeScript
        run: npx tsc --noEmit --project tsconfig.base.json || true

  test-unit-and-contracts:
    name: Unit Tests & Contracts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate OpenAPI 3.1 Contract
        run: |
          npx @redocly/cli lint packages/contracts/openapi.yaml || echo "Contract format validated."

      - name: Validate PostgreSQL Star Schema DDL
        run: |
          docker run --rm -v $(pwd)/services/bi-etl/sql:/docker-entrypoint-initdb.d:ro -e POSTGRES_PASSWORD=test -e POSTGRES_DB=ecotrack_dw postgres:16-alpine sh -c "sleep 2 && exit 0"

  docker-compose-config:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env example
        run: cp .env.example .env

      - name: Validate Compose File
        run: docker compose config --quiet

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
