version: '3.8'

services:
  # 1. Base de données opérationnelle (NoSQL MongoDB avec index 2dsphere)
  mongodb:
    image: mongo:7.0
    container_name: ecotrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ecotrack_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-EcoTrackMongo2026!}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ecotrack_db}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecotrack-network

  # 2. Entrepôt de données décisionnel (Data Warehouse PostgreSQL pour Power BI)
  postgres:
    image: postgres:16-alpine
    container_name: ecotrack-postgres-dw
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecotrack_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EcoTrackPostgres2026!}
      POSTGRES_DB: ${POSTGRES_DB:-ecotrack_dw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/bi-etl/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotrack_admin} -d ${POSTGRES_DB:-ecotrack_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecotrack-network

  # 3. Cache & Rate-Limiter (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: ecotrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-EcoTrackRedis2026!}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-EcoTrackRedis2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecotrack-network

  # 4. Bus d'événements asynchrone (RabbitMQ avec console de gestion)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecotrack-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ecotrack_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-EcoTrackRabbit2026!}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ecotrack-network

  # 5. Stockage d'objets compatible S3 (MinIO pour photos EXIF-purgées)
  minio:
    image: minio/minio:latest
    container_name: ecotrack-minio-s3
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console Web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ecotrack_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-EcoTrackMinio2026!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ecotrack-network

  # 6. API Gateway & Reverse Proxy Nginx (Routage SOA & Terminaison TLS)
  api-gateway:
    image: nginx:1.25-alpine
    container_name: ecotrack-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ecotrack-network

networks:
  ecotrack-network:
    name: ecotrack-network
    driver: bridge

volumes:
  mongodb_data:
    name: ecotrack_mongodb_data
  postgres_data:
    name: ecotrack_postgres_data
  redis_data:
    name: ecotrack_redis_data
  rabbitmq_data:
    name: ecotrack_rabbitmq_data
  minio_data:
    name: ecotrack_minio_data
