<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECOTRACK - Prévisualisation des Profils Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col font-sans overflow-hidden">
  
  <!-- Switcher Top Toolbar -->
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-600 w-8 h-8 rounded-lg flex items-center justify-center text-white shadow-sm shadow-emerald-500/20">
        <i data-lucide="leaf" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">ECOTRACK · Profils Web</h1>
        <p class="text-[11px] text-slate-400">Design System & Écrans Fidèles Figma (1440x900)</p>
      </div>
    </div>

    <!-- Screen Tabs Switcher -->
    <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl">
      <button id="btnAdmin" onclick="switchView('admin')" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow-sm transition-all">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i>
        <span>WEB_ADM_05_PROFILE (Admin)</span>
      </button>

      <button id="btnAgent" onclick="switchView('agent')" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">
        <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
        <span>WEB_AGT_04_PROFILE (Agent)</span>
      </button>
    </div>

    <!-- Actions Right -->
    <div class="flex items-center gap-2">
      <a id="btnExternal" href="web_adm_profile.html" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        <span>Ouvrir plein écran</span>
      </a>
    </div>
  </header>

  <!-- Frame Preview -->
  <main class="flex-1 bg-slate-950 p-2 sm:p-4 flex items-center justify-center overflow-hidden">
    <div class="w-full h-full bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-800">
      <iframe id="screenIframe" src="web_adm_profile.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function switchView(type) {
      const iframe = document.getElementById('screenIframe');
      const btnAdmin = document.getElementById('btnAdmin');
      const btnAgent = document.getElementById('btnAgent');
      const btnExternal = document.getElementById('btnExternal');

      if (type === 'admin') {
        iframe.src = 'web_adm_profile.html';
        btnExternal.href = 'web_adm_profile.html';
        btnAdmin.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow-sm transition-all";
        btnAgent.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all";
      } else {
        iframe.src = 'web_agt_profile.html';
        btnExternal.href = 'web_agt_profile.html';
        btnAgent.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 text-white shadow-sm transition-all";
        btnAdmin.className = "flex items-center gap-2 px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all";
      }
    }
  </script>
</body>
</html>
