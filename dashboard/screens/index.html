<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECOTRACK · Galerie & Export Figma des Écrans Web & Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col font-sans overflow-hidden">
  
  <!-- Switcher Top Toolbar -->
  <header class="bg-slate-900 border-b border-slate-800 px-5 py-2.5 flex items-center justify-between shrink-0 shadow-lg flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-600 w-8 h-8 rounded-lg flex items-center justify-center text-white shadow-sm shadow-emerald-500/20">
        <i data-lucide="leaf" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide flex items-center gap-2">
          <span>ECOTRACK · Écrans Figma</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">6 Écrans Prêts</span>
        </h1>
        <p class="text-[11px] text-slate-400">Design System & Écrans Fidèles prêts pour l'import <code>html.to.design</code></p>
      </div>
    </div>

    <!-- Screen Tabs Switcher Buttons -->
    <div class="flex items-center bg-slate-950 border border-slate-800 p-1 rounded-xl overflow-x-auto gap-1">
      
      <!-- 1. Profile Worker (Mobile) -->
      <button id="btn-wrk_profile" onclick="switchView('wrk_profile')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow-sm transition-all whitespace-nowrap">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>1. Profil Ouvrier Mobile</span>
      </button>

      <!-- 2. Carte Admin -->
      <button id="btn-adm_map" onclick="switchView('adm_map')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap">
        <i data-lucide="map" class="w-3.5 h-3.5"></i>
        <span>2. Carte d'Admin</span>
      </button>

      <!-- 3. Modifier Utilisateur -->
      <button id="btn-user_edit" onclick="switchView('user_edit')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap">
        <i data-lucide="user-cog" class="w-3.5 h-3.5"></i>
        <span>3. Modifier Utilisateur</span>
      </button>

      <!-- 4. Espace de travail complet -->
      <button id="btn-inbox_complete" onclick="switchView('inbox_complete')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        <span>4. Espace de Travail</span>
      </button>

      <!-- 5. Profil Admin -->
      <button id="btn-admin_profile" onclick="switchView('admin_profile')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i>
        <span>5. Profil Admin</span>
      </button>

      <!-- 6. Profil Agent -->
      <button id="btn-agent_profile" onclick="switchView('agent_profile')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap">
        <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
        <span>6. Profil Agent</span>
      </button>

    </div>

    <!-- Actions Right -->
    <div class="flex items-center gap-2">
      <a href="interactive_prototype.html" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-sm transition-all">
        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
        <span>Prototype Live</span>
      </a>
      <a id="btnExternal" href="mob_wrk_profile.html" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        <span>Ouvrir seul</span>
      </a>
    </div>
  </header>

  <!-- Frame Preview -->
  <main class="flex-1 bg-slate-950 p-2 sm:p-4 flex items-center justify-center overflow-hidden">
    <div id="previewCard" class="w-full h-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-800 transition-all duration-300 flex items-center justify-center">
      <iframe id="screenIframe" src="mob_wrk_profile.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const screens = {
      wrk_profile: { file: 'mob_wrk_profile.html', title: 'Profil Ouvrier Mobile (393x852)', isMobile: true },
      adm_map: { file: 'web_adm_map.html', title: 'Carte de Supervision Admin (1440x900)', isMobile: false },
      user_edit: { file: 'web_adm_user_edit.html', title: 'Modifier Utilisateur Admin (1440x900)', isMobile: false },
      inbox_complete: { file: 'web_inbox_complete.html', title: 'Espace de Travail Complet (1440x900)', isMobile: false },
      admin_profile: { file: 'web_adm_profile.html', title: 'Profil Super Admin (1440x900)', isMobile: false },
      agent_profile: { file: 'web_agt_profile.html', title: 'Profil Agent Territorial (1440x900)', isMobile: false }
    };

    function switchView(type) {
      const iframe = document.getElementById('screenIframe');
      const btnExternal = document.getElementById('btnExternal');
      const info = screens[type];

      if (!info) return;

      iframe.src = info.file;
      btnExternal.href = info.file;

      // Reset all buttons
      Object.keys(screens).forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        if (btn) {
          btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all whitespace-nowrap";
        }
      });

      // Highlight active button
      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) {
        activeBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow-sm transition-all whitespace-nowrap";
      }
    }
  </script>
</body>
</html>
