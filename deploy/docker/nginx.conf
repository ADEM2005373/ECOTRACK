worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # ── CORS origin whitelist ─────────────────────────────────────────────────
    # Vercel production/preview + Ngrok + Cloudflare Tunnel + local dev
    map $http_origin $cors_origin {
        default                               "";
        "~^https://.*\.vercel\.app$"          $http_origin;
        "~^https://.*\.ngrok-free\.app$"      $http_origin;
        "~^https://.*\.ngrok\.io$"            $http_origin;
        "~^https://.*\.trycloudflare\.com$"   $http_origin;
        "~^http://localhost:(3000|5173)$"     $http_origin;
        "~^http://127\.0\.0\.1:(3000|5173)$"  $http_origin;
    }

    # Upstreams vers microservices (host.docker.internal = Windows host)
    upstream identity_service {
        server host.docker.internal:3001 max_fails=3 fail_timeout=10s;
    }

    upstream report_service {
        server host.docker.internal:3002 max_fails=3 fail_timeout=10s;
    }

    upstream workflow_service {
        server host.docker.internal:3003 max_fails=3 fail_timeout=10s;
    }

    upstream ai_service {
        server host.docker.internal:8000 max_fails=3 fail_timeout=10s;
    }

    upstream audit_service {
        server host.docker.internal:3004 max_fails=3 fail_timeout=10s;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # Sécurité HTTP Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ── CORS globale (toutes routes /api/) ────────────────────────────────
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, ngrok-skip-browser-warning, x-user-id, x-actor-id, x-user-role, x-user-name, x-user-email, x-user-municipality" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Preflight — réponse immédiate sans proxy
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Healthcheck Gateway
        location /health {
            return 200 '{"status":"healthy","service":"ecotrack-gateway"}';
            add_header Content-Type application/json;
        }

        # 1. Identity & Auth Service
        location /api/v1/auth {
            proxy_pass http://identity_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2a. Workflow exceptions under /reports path (reopen / resolve)
        location ~ ^/api/v1/reports/[^/]+/(reopen|resolve)$ {
            proxy_pass http://workflow_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2b. Reports Service (Signalements & GeoJSON)
        location /api/v1/reports {
            proxy_pass http://report_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Workflows & Interventions Service
        location /api/v1/workflow {
            proxy_pass http://workflow_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/interventions {
            proxy_pass http://workflow_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. IA Vision Service (FastAPI / MobileNetV3)
        location /api/v1/vision {
            proxy_pass http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 5. Audit & Compliance Service
        location /api/v1/audit {
            proxy_pass http://audit_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. MinIO S3 Static Storage Proxy
        location /storage/ {
            proxy_pass http://minio_s3/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
