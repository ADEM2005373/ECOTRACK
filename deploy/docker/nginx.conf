worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M; # Pour uploads photos haute résolution

    # Upstreams vers microservices (port mappings par défaut)
    upstream identity_service {
        server host.docker.internal:3001 max_fails=3 fail_timeout=10s;
    }

    upstream report_service {
        server host.docker.internal:3002 max_fails=3 fail_timeout=10s;
    }

    upstream workflow_service {
        server host.docker.internal:3003 max_fails=3 fail_timeout=10s;
    }

    upstream ai_service {
        server host.docker.internal:8000 max_fails=3 fail_timeout=10s;
    }

    upstream audit_service {
        server host.docker.internal:3004 max_fails=3 fail_timeout=10s;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # Sécurité HTTP Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Healthcheck Gateway
        location /health {
            return 200 '{"status":"healthy","service":"ecotrack-gateway","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # 1. Identity & Auth Service
        location /api/v1/auth {
            proxy_pass http://identity_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Reports Service (Signalements & GeoJSON)
        location /api/v1/reports {
            proxy_pass http://report_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Workflows & Interventions Service
        location /api/v1/interventions {
            proxy_pass http://workflow_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. IA Vision Service (FastAPI / YOLO / Classification)
        location /api/v1/vision {
            proxy_pass http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 5. Audit & Compliance Service
        location /api/v1/audit {
            proxy_pass http://audit_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. MinIO S3 Static Storage Proxy
        location /storage/ {
            proxy_pass http://minio_s3/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
